<form #form="ngForm" (ngSubmit)="onSubmit(form)">
  <h2>Login</h2>

  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" ngModel required email/> <!--Make sure to add name because it will be registered by ngModel-->
    </div>

    <div class="control no-margin">
      <label for="password">Password</label>
      <input 
        id="password" 
        type="password" 
        name="password" 
        ngModel 
        required 
        minlength="6"
         /> <!-- There's also maxlength and pattern -->
    </div>

    <button class="button">Login</button>
  </div>
</form>
