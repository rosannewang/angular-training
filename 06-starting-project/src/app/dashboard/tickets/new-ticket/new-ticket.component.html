<form (ngSubmit)="onSubmit(titleInput.value, textInput.value)" #form>
  <app-control label="Title">
    <input name="title" id="title" #titleInput #input/> <!--storing template element in a variable; this will catch the intered input-->
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3" #textInput #input></textarea>
  </app-control>
  <p>
    <button appButton #btn> <!-- note: btn type is different from <button appButton #btn>-->
      Submit
      <span ngProjectAs="icon">⌲</span>
    </button>
  </p>
</form>
