<form (ngSubmit)="onSubmit()" #form>
  <app-control label="Title">
    <input name="title" id="title" #input [ngModel]="enteredTitle()" (ngModelChange)="enteredTitle.set($event)"/>
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3" #input [ngModel]="enteredText()" (ngModelChange)="enteredText.set($event)"></textarea>
  </app-control>
  <p>
    <button appButton #btn> <!-- note: btn type is different from <button appButton #btn>-->
      Submit
      <span ngProjectAs="icon">⌲</span>
    </button>
  </p>
</form>
