<form (ngSubmit)="onSubmit(titleInput)">
  <app-control class="control" label="Title">
    <input name="title" id="title" #titleInput /> <!--storing template element in a variable; this will catch the intered input-->
  </app-control>
  <app-control class="control" label="Request">
    <textarea name="request" id="request" rows="3"></textarea>
  </app-control>
  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">⌲</span>
    </button>
  </p>
</form>
